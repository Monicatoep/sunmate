services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./classes:/app/classes
      - ./sunmate.db:/app/sunmate.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
